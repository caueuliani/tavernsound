# Free beta only. Deploy from main after database migrations are applied.
services:
  - type: web
    name: tavernsound-beta
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev --ignore-scripts && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: beta
      - key: TEST_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: AGORA_APP_ID
        sync: false
      - key: NEXT_PUBLIC_AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
# Optional Google OAuth variables can be added after the public URL is known.
# Do NOT set NEXT_PUBLIC_API_URL: the browser uses the same origin.
